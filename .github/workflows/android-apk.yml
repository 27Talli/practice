name: Build Android APKs

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/schemas/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'scripts/bootstrap-gradle.*'
      - 'scripts/install-android-sdk.py'
      - 'scripts/run-android-tests.sh'
      - 'scripts/check_schema.py'
      - 'scripts/*backup*'
      - 'scripts/*rescue*'
      - 'scripts/BackupCrypto.java'
      - 'scripts/stage_signing_key.py'
      - 'scripts/check_release_signing.py'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the verified Milestone 1 schema
        if: hashFiles('app/schemas/**/1.json') == ''
        uses: actions/download-artifact@v4
        with:
          name: verification-reports
          run-id: 40327606654
          repository: 27Talli/practice
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/milestone1-verification
      - name: Stage the historical schema for migration tests
        if: hashFiles('app/schemas/**/1.json') == ''
        run: |
          schema_root="$RUNNER_TEMP/milestone1-verification/app/schemas"
          test -f "$schema_root/com.offerpoint.pos.data.local.database.PosDatabase/1.json"
          mkdir -p app/schemas
          cp -R "$schema_root/." app/schemas/
      - name: Check host rescue tool and create interoperability fixture
        run: python3 scripts/test_rescue_tool.py
      - name: Stage retained release signing when configured
        env:
          POS_KEYSTORE_BASE64: ${{ secrets.POS_KEYSTORE_BASE64 }}
          POS_STORE_PASSWORD: ${{ secrets.POS_STORE_PASSWORD }}
          POS_KEY_ALIAS: ${{ secrets.POS_KEY_ALIAS }}
          POS_KEY_PASSWORD: ${{ secrets.POS_KEY_PASSWORD }}
        run: python3 scripts/stage_signing_key.py
      - name: Install Android SDK packages
        run: python3 scripts/install-android-sdk.py
      - name: Check schema and SQL design
        run: python3 scripts/check_schema.py
      - name: Build APKs, run unit tests, and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            :app:assembleLiveDebug :app:assembleDemoDebug \
            :app:testLiveDebugUnitTest :app:testDemoDebugUnitTest \
            :app:lintLiveDebug :app:assembleLiveDebugAndroidTest
      - name: Verify APK signatures and record checksums
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/live/debug/app-live-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/demo/debug/app-demo-debug.apk
          sha256sum app/build/outputs/apk/live/debug/app-live-debug.apk app/build/outputs/apk/demo/debug/app-demo-debug.apk | tee apk-checksums.txt
          {
            echo '## Offer Point POS Milestone 5'
            echo
            echo 'Signed debug APKs for Android 8.0 and newer.'
            echo 'Live and Demo have separate application IDs and data.'
            echo 'Barcode decoding is bundled and runs offline; the app requests camera access only for scanning.'
            echo 'Backup/restore, receipt, migration, scanner, and checkout UI tests run on Android below.'
            echo 'Physical-camera and real-printer output still require acceptance testing on the shop phone and printer.'
            echo
            echo '### SHA-256 checksums'
            echo '```'
            cat apk-checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check release signing with an isolated unpublished test key
        if: env.POS_SIGNING_READY != 'true'
        run: python3 scripts/check_release_signing.py
      - name: Build and verify releases with the retained key
        if: env.POS_SIGNING_READY == 'true'
        env:
          POS_STORE_PASSWORD: ${{ secrets.POS_STORE_PASSWORD }}
          POS_KEY_ALIAS: ${{ secrets.POS_KEY_ALIAS }}
          POS_KEY_PASSWORD: ${{ secrets.POS_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --max-workers=2 :app:assembleLiveRelease :app:assembleDemoRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/live/release/app-live-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/demo/release/app-demo-release.apk
          sha256sum app/build/outputs/apk/live/release/app-live-release.apk app/build/outputs/apk/demo/release/app-demo-release.apk >> apk-checksums.txt
      - name: Upload retained-key release APKs
        if: env.POS_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: offer-point-pos-retained-key-releases
          path: |
            app/build/outputs/apk/live/release/app-live-release.apk
            app/build/outputs/apk/demo/release/app-demo-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload live APK
        uses: actions/upload-artifact@v4
        with:
          name: offer-point-pos-live-debug
          path: app/build/outputs/apk/live/debug/app-live-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: offer-point-pos-demo-debug
          path: app/build/outputs/apk/demo/debug/app-demo-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Run database, migration, and checkout UI tests on Android
        run: bash scripts/run-android-tests.sh
      - name: Remove staged signing key
        if: always() && env.POS_SIGNING_READY == 'true'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['POS_SIGNING_STORE_FILE']).unlink(missing_ok=True)
          PY
      - name: Record generated schemas and test totals
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in sorted(Path('app/schemas').glob('**/*.json')):
              data = path.read_bytes()
              encoded = base64.b64encode(data).decode('ascii')
              parts = [encoded[index:index + 12000] for index in range(0, len(encoded), 12000)]
              for index, part in enumerate(parts):
                  print('ROOM_SCHEMA_JSON ' + json.dumps({
                      'path': path.as_posix(), 'part': index, 'parts': len(parts),
                      'sha256': hashlib.sha256(data).hexdigest(), 'base64': part,
                  }), flush=True)

          groups = {}
          report_paths = list(Path('app/build/test-results').glob('**/TEST-*.xml'))
          report_paths += list(Path('app/build/outputs/androidTest-results').glob('**/TEST-*.xml'))
          for path in sorted(report_paths):
              try:
                  root = ET.parse(path).getroot()
              except (ET.ParseError, OSError) as error:
                  print('TEST_REPORT_ERROR ' + json.dumps({'path': str(path), 'error': str(error)}))
                  continue
              group = ('device-live' if 'androidTest-results' in str(path) else
                       'jvm-live' if 'testLive' in str(path) else 'jvm-demo' if 'testDemo' in str(path) else 'jvm-other')
              counts = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
              for suite in root.iter('testsuite'):
                  if list(suite.iter('testsuite'))[1:]:
                      continue
                  for key in counts:
                      counts[key] += int(suite.get(key, '0'))
              total = groups.setdefault(group, {key: 0 for key in counts})
              for key, value in counts.items():
                  total[key] += value
              print('TEST_RESULT_JSON ' + json.dumps({'group': group, 'path': str(path), **counts}))
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is not None:
                      print('TEST_FAILURE_JSON ' + json.dumps({
                          'group': group, 'class': case.get('classname'), 'name': case.get('name'),
                          'message': failure.get('message'), 'detail': (failure.text or '')[:12000],
                      }), flush=True)
          print('TEST_TOTALS_JSON ' + json.dumps(groups), flush=True)
          summary = Path(__import__('os').environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as output:
              output.write('\n### Executed test reports\n\n')
              for group, counts in sorted(groups.items()):
                  output.write(f"- {group}: {counts['tests']} tests, {counts['failures']} failures, {counts['errors']} errors, {counts['skipped']} skipped\n")
              if 'device-live' not in groups:
                  output.write('- No Android device test report was produced; inspect the emulator step.\n')
          PY
      - name: Upload verification reports and Room schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/schemas/
            apk-checksums.txt
          if-no-files-found: warn
          retention-days: 90

